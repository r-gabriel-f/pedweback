name: Keep Backend Alive

# Hace ping al backend cada 10 min para evitar que Render duerma.
# Tambien mantiene activo el proyecto de Supabase (que se pausa tras 7 dias).

on:
  schedule:
    # Cada 10 minutos. Cron en GitHub Actions usa UTC.
    - cron: '*/10 * * * *'
  # Permite dispararlo manualmente desde la pestana Actions
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend + DB
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.BACKEND_URL }}/health/db")
          echo "HTTP $response"
          if [ "$response" -ne 200 ]; then
            echo "Ping failed with status $response"
            exit 1
          fi
          echo "Backend + DB alive"
